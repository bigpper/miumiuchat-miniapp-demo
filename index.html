<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>MiuMiu Chat MiniApp 演示</title>
  <style>
    :root {
      --background: #f1f5f9;
      --foreground: #172033;
      --accent: #07c160;
      --accent-soft: #e9f9f0;
      --line: #e6eaf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .demo-shell {
      min-height: 100vh;
      padding: 22px 16px 32px;
      background:
        radial-gradient(circle at 100% 0%, rgba(7, 193, 96, 0.12), transparent 34%),
        linear-gradient(180deg, #f8fafc 0%, #eef3f7 100%);
    }
    .hero-card { width: min(100%, 420px); margin: 0 auto; }
    .app-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 17px;
      background: linear-gradient(145deg, #13cc6b, #06ad55);
      color: white;
      box-shadow: 0 12px 28px rgba(7, 193, 96, 0.23);
      font-size: 27px;
      font-weight: 750;
    }
    .eyebrow {
      margin: 24px 0 9px;
      color: #738096;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }
    .intro {
      margin: 12px 0 22px;
      color: #687489;
      font-size: 15px;
      line-height: 1.75;
    }
    .status-card {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 16px;
      border: 1px solid #dce7e1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 28px rgba(44, 58, 79, 0.07);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      margin-top: 5px;
      flex: 0 0 auto;
      border: 2px solid #74dba4;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .status-card strong {
      display: block;
      color: #1f2a3d;
      font-size: 15px;
    }
    .status-card p {
      margin: 5px 0 0;
      color: #788397;
      font-size: 12px;
      line-height: 1.5;
    }
    .feature-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .feature-grid article {
      position: relative;
      padding: 17px 18px 16px 54px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
    }
    .feature-grid span {
      position: absolute;
      top: 17px;
      left: 17px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    .feature-grid strong { display: block; font-size: 14px; }
    .feature-grid p {
      margin: 6px 0 0;
      color: #7c8799;
      font-size: 12px;
      line-height: 1.55;
    }
    html[data-bridge-ready="true"] .status-card {
      border-color: #ccebd9;
      background: #f7fffa;
    }
    @media (min-width: 700px) {
      .demo-shell { padding-top: 34px; }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <section class="hero-card" aria-labelledby="demo-title">
      <div class="app-mark" aria-hidden="true">M</div>
      <p class="eyebrow">MIUMIU CHAT · MINIAPP</p>
      <h1 id="demo-title">示例网站</h1>
      <p class="intro">这是一个用于验证群入口、手机模式容器与安全桥接能力的演示小程序。</p>
      <div class="status-card" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="bridge-status">正在初始化</strong>
          <p id="bridge-detail">正在读取 MiniApp 运行环境…</p>
        </div>
      </div>
      <div class="feature-grid" aria-label="演示能力">
        <article>
          <span>01</span>
          <strong>固定手机画布</strong>
          <p>电脑与手机端始终保持统一的移动端体验。</p>
        </article>
        <article>
          <span>02</span>
          <strong>群成员授权</strong>
          <p>仅绑定群内的有效成员可以查看并打开。</p>
        </article>
        <article>
          <span>03</span>
          <strong>安全桥接</strong>
          <p>页面通过受控协议连接聊天系统宿主能力。</p>
        </article>
      </div>
    </section>
  </main>
  <script>
    (function () {
      "use strict";
      var PROTOCOL = "boxim-miniapp";
      var BROKER_PROTOCOL = "boxim-miniapp-broker";
      var VERSION = "1.0";
      var appId = "01KYN5H8CWSR2PJ6Q8WE46P12V";
      var status = document.getElementById("bridge-status");
      var detail = document.getElementById("bridge-detail");
      var brokerFrame = null;
      var brokerOrigin = null;
      var pageNonce = null;

      function setState(label, message, ready) {
        status.textContent = label;
        detail.textContent = message;
        document.documentElement.dataset.bridgeReady = ready ? "true" : "false";
      }
      function base64url(bytes) {
        var binary = "";
        for (var i = 0; i < bytes.length; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }
      function randomBase64url(length) {
        var bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);
        return base64url(bytes);
      }
      function ulid() {
        var alphabet = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
        var bytes = new Uint8Array(16);
        var time = Date.now();
        for (var index = 5; index >= 0; index -= 1) {
          bytes[index] = time % 256;
          time = Math.floor(time / 256);
        }
        crypto.getRandomValues(bytes.subarray(6));
        var bits = "00";
        for (var i = 0; i < bytes.length; i += 1) {
          bits += bytes[i].toString(2).padStart(8, "0");
        }
        var result = "";
        for (var offset = 0; offset < 130; offset += 5) {
          result += alphabet[parseInt(bits.slice(offset, offset + 5), 2)];
        }
        return result;
      }
      function validPreload(value) {
        return value
          && value.protocol === BROKER_PROTOCOL
          && value.version === VERSION
          && value.kind === "preload"
          && typeof value.brokerUrl === "string";
      }
      function sendReady() {
        if (!brokerFrame || !brokerFrame.contentWindow || !brokerOrigin) return;
        pageNonce = randomBase64url(24);
        brokerFrame.contentWindow.postMessage({
          protocol: PROTOCOL,
          version: VERSION,
          id: ulid(),
          kind: "request",
          method: "miniapp.ready",
          nonce: pageNonce,
          payload: {
            appId: appId,
            sdkVersion: "1.0.0",
            protocolVersion: VERSION,
            pageNonce: pageNonce,
            pkceChallenge: randomBase64url(32),
            pkceMethod: "S256",
            requestedCapabilities: ["host.context"]
          },
          error: null
        }, brokerOrigin);
      }
      window.addEventListener("message", function (event) {
        if (!brokerFrame
          || event.source !== brokerFrame.contentWindow
          || event.origin !== brokerOrigin
          || !event.data) {
          return;
        }
        if (event.data.protocol === BROKER_PROTOCOL
          && event.data.version === VERSION
          && event.data.kind === "bound") {
          sendReady();
          return;
        }
        if (event.data.protocol === PROTOCOL
          && event.data.version === VERSION
          && event.data.nonce === pageNonce
          && event.data.method === "host.init"
          && event.data.error === null) {
          setState("已连接聊天系统", "MiniApp 安全桥接与群身份上下文已就绪。", true);
        }
      });
      try {
        var preload = JSON.parse(window.name || "{}");
        if (!validPreload(preload)) throw new Error("invalid preload");
        var brokerUrl = new URL(preload.brokerUrl);
        brokerOrigin = brokerUrl.origin;
        brokerFrame = document.createElement("iframe");
        brokerFrame.src = brokerUrl.href;
        brokerFrame.title = "MiniApp secure bridge";
        brokerFrame.hidden = true;
        document.body.appendChild(brokerFrame);
        setState("正在连接聊天系统", "正在建立安全桥接，请稍候…", false);
      } catch (_) {
        setState("请从聊天系统打开", "此演示页只能作为 MiniApp 在聊天系统中运行。", false);
      }
    }());
  </script>
</body>
</html>
