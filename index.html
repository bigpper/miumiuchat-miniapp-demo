<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>MiuMiu Chat MiniApp 演示</title>
  <style>
    :root {
      --background: #f1f5f9;
      --foreground: #172033;
      --accent: #07c160;
      --accent-soft: #e9f9f0;
      --line: #e6eaf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .demo-shell {
      min-height: 100vh;
      padding: 22px 16px 32px;
      background:
        radial-gradient(circle at 100% 0%, rgba(7, 193, 96, 0.12), transparent 34%),
        linear-gradient(180deg, #f8fafc 0%, #eef3f7 100%);
    }
    .hero-card { width: min(100%, 420px); margin: 0 auto; }
    .app-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 17px;
      background: linear-gradient(145deg, #13cc6b, #06ad55);
      color: white;
      box-shadow: 0 12px 28px rgba(7, 193, 96, 0.23);
      font-size: 27px;
      font-weight: 750;
    }
    .eyebrow {
      margin: 24px 0 9px;
      color: #738096;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }
    .intro {
      margin: 12px 0 22px;
      color: #687489;
      font-size: 15px;
      line-height: 1.75;
    }
    .status-card {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 16px;
      border: 1px solid #dce7e1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 28px rgba(44, 58, 79, 0.07);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      margin-top: 5px;
      flex: 0 0 auto;
      border: 2px solid #74dba4;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .status-card strong {
      display: block;
      color: #1f2a3d;
      font-size: 15px;
    }
    .status-card p {
      margin: 5px 0 0;
      color: #788397;
      font-size: 12px;
      line-height: 1.5;
    }
    .feature-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .feature-grid article {
      position: relative;
      padding: 17px 18px 16px 54px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
    }
    .feature-grid span {
      position: absolute;
      top: 17px;
      left: 17px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    .feature-grid strong { display: block; font-size: 14px; }
    .feature-grid p {
      margin: 6px 0 0;
      color: #7c8799;
      font-size: 12px;
      line-height: 1.55;
    }
    html[data-bridge-ready="true"] .status-card {
      border-color: #ccebd9;
      background: #f7fffa;
    }
    @media (min-width: 700px) {
      .demo-shell { padding-top: 34px; }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <section class="hero-card" aria-labelledby="demo-title">
      <div class="app-mark" aria-hidden="true">M</div>
      <p class="eyebrow">MIUMIU CHAT · MINIAPP</p>
      <h1 id="demo-title">示例网站</h1>
      <p class="intro">这是一个用于验证群入口、手机模式容器与安全桥接能力的演示小程序。</p>
      <div class="status-card" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="bridge-status">正在初始化</strong>
          <p id="bridge-detail">正在读取 MiniApp 运行环境…</p>
        </div>
      </div>
      <div class="feature-grid" aria-label="演示能力">
        <article>
          <span>01</span>
          <strong>固定手机画布</strong>
          <p>电脑与手机端始终保持统一的移动端体验。</p>
        </article>
        <article>
          <span>02</span>
          <strong>群成员授权</strong>
          <p>仅绑定群内的有效成员可以查看并打开。</p>
        </article>
        <article>
          <span>03</span>
          <strong>安全桥接</strong>
          <p>页面通过受控协议连接聊天系统宿主能力。</p>
        </article>
      </div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      const preloadedName = window.name || '';
      window.name = '';
      const status = document.getElementById('bridge-status');
      const detail = document.getElementById('bridge-detail');
    const view = {
      CONNECTING: ['正在连接聊天系统', '正在建立安全桥接，请稍候…'],
      READY_SENT: ['正在验证宿主', '安全桥接已建立，正在等待宿主确认…'],
      HOST_READY: ['已连接聊天系统', 'MiniApp 安全桥接与宿主上下文已就绪。'],
      RUNNING: ['演示运行中', '宿主已完成一次性启动授权。'],
      BLOCKED: ['请从聊天系统打开', '此演示页只能作为 MiniApp 在聊天系统中运行。'],
      CLOSED: ['已关闭', 'MiniApp 安全桥接已清理。']
    };
      // 允许用 ?appId=<ULID> 指定本页扮演哪个小程序。
      //
      // 不指定时保持原来的固定值，老的入口地址照常工作。
      //
      // 这样做不降低安全性：宿主才是权威方，它只会下发自己实际启动的那个
      // appId；页面这里声明什么，只决定「对不上就拒绝」，无法冒充成别的应用。
      // 反过来，写死单一 appId 会让同一份演示页服务不了第二个小程序——
      // 那正是它此前的限制。
      const DEFAULT_APP_ID = '01KYN5H8CWSR2PJ6Q8WE46P12V';
      const CANONICAL_ULID = /^[0-9A-HJKMNP-TV-Z]{26}$/;
      const requestedAppId = (function () {
        try {
          // 测试环境只注入 window 与 document，没有 location；缺失时降级。
          const search = window.location && window.location.search;
          if (!search) return null;
          // 手工解析而不用 URLSearchParams：这个页面要跑在老 webview 里，
          // 少一个全局依赖就少一处「在某些环境里静默回落」的可能。
          const match = /[?&]appId=([^&]*)/.exec(search);
          if (!match) return null;
          const value = decodeURIComponent(match[1]);
          return CANONICAL_ULID.test(value) ? value : null;
        } catch (error) {
          return null;
        }
      }());

      import('./miniapp-sdk.js').then(({createMiniAppSdk}) => {
        createMiniAppSdk({
          appId: requestedAppId || DEFAULT_APP_ID,
          trustedBrokerUrls: [
            'http://localhost:8080/miniapp-host-broker.html',
            'http://localhost:5173/h5/static/miniapp-host-broker.html'
          ],
          preloadedName,
          onStatus({phase}) {
            const [label, message] = view[phase];
            status.textContent = label;
            detail.textContent = message;
            document.documentElement.dataset.bridgeReady = phase === 'RUNNING' ? 'true' : 'false';
          },
          onLaunchCode() {
            // The static Demo intentionally has no BFF and never exchanges launch codes.
          }
        });
      }).catch(() => {
        status.textContent = view.BLOCKED[0];
        detail.textContent = view.BLOCKED[1];
      });
    }());
  </script>
</body>
</html>
